[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fuel-purchase-agent"
version = "0.1.0"
description = "Agente de IA que sinaliza se o preço do combustível na distribuidora deve subir ou cair, para antecipar ou adiar a compra do posto."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "matplotlib>=3.9",
    "markdown>=3.7",
    "langgraph>=0.2",
    "google-genai>=2.0",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fuel-agent = "fuel_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
